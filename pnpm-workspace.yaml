# pnpm 10+ moved settings out of package.json's "pnpm" field into this file.
#
# Security overrides force patched versions of transitive deps flagged by Dependabot.
# Each entry is scoped to the vulnerable range where the fix stays inside one major, so
# nothing is moved further than the advisory requires.
#   - dompurify: pulled in (pinned to 3.2.7) by monaco-editor@0.55.1; ^3.4.17 clears the
#     sanitizer-bypass/XSS advisories. monaco uses only DOMPurify.sanitize(string),
#     which is API-stable across 3.2 -> 3.4, so the override is drop-in.
#   - esbuild: bundled by vite@7.3.x at 0.27.x; 0.28.1 fixes the Windows dev-server
#     arbitrary-file-read advisory (GHSA-g7r4-m6w7-qqqr). We use only @vitejs/plugin-react
#     (not plugin-legacy), so the one documented 0.28 regression does not apply.
#   - The rest are dev/build tooling only (wdio e2e harness, vite, browserslist, mocha);
#     none of them ships inside the app bundle.
#   - serialize-javascript (mocha, via wdio) and minimatch 9 (glob, via wdio) have their
#     fixes only in a newer major; both keep the same call signatures the e2e harness uses.
overrides:
  dompurify: ^3.4.17
  esbuild: 0.28.1
  "undici@>=6 <6.29.1": ^6.29.1
  "undici@>=7 <7.30.1": ^7.30.1
  "brace-expansion@<1.1.21": ^1.1.21
  "brace-expansion@>=2 <2.1.7": ^2.1.7
  "browserslist@<4.28.7": ^4.28.7
  "baseline-browser-mapping@<2.11.0": ^2.11.0
  "ip-address@<10.7.1": ^10.7.1
  "minimatch@>=7 <11.0.1": ^11.0.1
  "postcss@<8.5.23": ^8.5.23
  "serialize-javascript@<7.1.3": ^7.1.3
  "smol-toml@<1.9.0": ^1.9.0
  "source-map-js@<1.2.2": ^1.2.2

# esbuild ships a build script that links its platform binary; pnpm blocks build scripts
# by default. Allow just this one so `pnpm install` completes non-interactively.
onlyBuiltDependencies:
  - esbuild
