name: CI

# The gate CONTRIBUTING.md's pre-PR checklist describes. Until this existed, every
# check in that list was enforced by discipline alone.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight — a PR that gets three
# commits in a minute should burn one runner, not three.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from `rust` on purpose: the two fail for unrelated reasons, and a red check
  # should say which half broke without anyone opening the log.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" — do not also set `version:`
      # here, action-setup errors on two sources (same note as release.yml).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      # Catches what a typecheck cannot: a bad import path, a Vite plugin
      # misconfiguration, a Monaco chunk that fails to resolve.
      - name: Build
        run: pnpm build

  # The phone app (mobile/) is its own npm project with its own lockfile, typecheck and
  # jest suite; nothing above touches it. No Android build here: it costs a full Gradle
  # + NDK run per push, and the pure logic it would exercise is what jest covers.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest

  # The background watcher's rules ship as Kotlin (WatchRules.kt is a port of
  # mobile/src/logic/watch.ts, NativeLogRules.kt of diagLog.ts), and their JUnit suites are
  # what keeps the two sides in step. Those four files touch nothing Android -- only
  # org.json, java.* and JUnit -- so they compile with plain kotlinc on a JVM: no Android
  # SDK, no expo prebuild, no Gradle. Versions are pinned; the jars come from Maven Central.
  kotlin-rules:
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: 2.1.20
      SRC: mobile/modules/bg-watch/android/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download kotlinc and test jars
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kt"
          cd "$RUNNER_TEMP/kt"
          curl -fsSL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q kotlin.zip
          chmod +x kotlinc/bin/*
          M=https://repo1.maven.org/maven2
          curl -fsSLO "$M/junit/junit/4.13.2/junit-4.13.2.jar"
          curl -fsSLO "$M/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          curl -fsSLO "$M/org/json/json/20240303/json-20240303.jar"

      - name: Compile rules and tests
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/kt"
          P=expo/modules/bgwatch
          "$K/kotlinc/bin/kotlinc" -include-runtime \
            -cp "$K/junit-4.13.2.jar:$K/hamcrest-core-1.3.jar:$K/json-20240303.jar" \
            -d "$K/rules.jar" \
            "$SRC/main/java/$P/WatchRules.kt" "$SRC/main/java/$P/NativeLogRules.kt" \
            "$SRC/test/java/$P/WatchRulesTest.kt" "$SRC/test/java/$P/NativeLogRulesTest.kt"

      - name: Tests
        run: |
          K="$RUNNER_TEMP/kt"
          java -cp "$K/rules.jar:$K/junit-4.13.2.jar:$K/hamcrest-core-1.3.jar:$K/json-20240303.jar" \
            org.junit.runner.JUnitCore expo.modules.bgwatch.WatchRulesTest expo.modules.bgwatch.NativeLogRulesTest

  rust:
    # Both shipping platforms, because they compile DIFFERENT programs. Whole modules
    # are cfg-gated (`tmux`, `session_budget`) and the spawn, PTY, path, and
    # process-kill paths each have a Windows arm that a macOS run never type-checks.
    # That is not hypothetical: the Windows build was broken for 76 commits behind a
    # macOS-only gate, because an inner `#![cfg(not(windows))]` contradicted the
    # `allow(dead_code)` at the mod site and nothing ever compiled it.
    #
    # Linux is deliberately absent: nothing ships there, so it would be a third
    # program to keep green for no user.
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Without this the two legs collide on one cache key and each restores the
          # other's target dir.
          key: ${{ matrix.os }}

      # Formatting has no platform arm, so checking it twice would only buy a slower
      # red. One leg owns it.
      - name: Format
        if: matrix.os == 'macos-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # -D warnings from the start: a warning-tolerant lint job stops being read within
      # a month. If the tree does not pass on the first run, fix the lints rather than
      # weakening this line. Per-platform, because a lint inside a `#[cfg(windows)]`
      # block is invisible to the macOS leg -- exactly how two of them survived.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
