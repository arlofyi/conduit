name: Mobile release

# Every change to the phone app that lands on main becomes an installable APK on a GitHub
# release, which the app itself offers as an update (Settings -> App) -- no USB, no adb.
#
# Tags are `mobile-b<build>`, never `v*`: `v*` tags drive the desktop's release.yml, and the
# desktop updater reads `releases/latest`, so phone releases are published with --latest=false.
# <build> is the APK's versionCode and only ever goes up (the last phone tag + 1).
#
# Signing uses Conduit's own release key from repository secrets, never the template's public
# debug key (see mobile/plugins/withReleaseSigning.js for why). Without the secrets the job
# fails rather than publish an APK nobody can update to:
#   MOBILE_KEYSTORE_BASE64   the .jks, base64
#   MOBILE_KEYSTORE_PASSWORD
#   MOBILE_KEY_ALIAS
#   MOBILE_KEY_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (off = build and check only, e.g. from a branch)"
        type: boolean
        default: true

# One phone release at a time: two runs would compute the same build number.
concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # the previous phone tag (build number, release notes) needs history and tags
          fetch-depth: 0

      - name: Require the signing secrets
        env:
          KS: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.MOBILE_KEY_ALIAS }}
          KP: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Phone release signing secrets are not set (MOBILE_KEYSTORE_BASE64, MOBILE_KEYSTORE_PASSWORD, MOBILE_KEY_ALIAS, MOBILE_KEY_PASSWORD). See mobile/README.md, 'Releases'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Build number and notes
        id: meta
        run: |
          base=$(node -p "require('./app.json').expo.version")
          prev=$(git tag -l 'mobile-b*' --sort=-v:refname | head -n 1)
          last=${prev#mobile-b}
          # The first release starts at 100: every build installed by hand so far is 1.
          if [ -z "$prev" ]; then build=100; else build=$((last + 1)); fi
          {
            echo "This build was made from \`${GITHUB_SHA::7}\`. Install it from the phone app (Settings -> App -> Update), or download the APK below."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..HEAD" -- . ../.github/workflows/mobile-release.yml
            else
              git log --no-merges -n 30 --format='- %s' HEAD -- .
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Phone app $base, build $build (previous: ${prev:-none})"

      - name: Prebuild
        env:
          CONDUIT_MOBILE_BUILD: ${{ steps.meta.outputs.build }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Write the keystore
        env:
          KS: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/conduit-release.jks"

      - name: Gradle assembleRelease
        working-directory: mobile/android
        env:
          CONDUIT_MOBILE_BUILD: ${{ steps.meta.outputs.build }}
          CONDUIT_KEYSTORE: ${{ runner.temp }}/conduit-release.jks
          CONDUIT_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          CONDUIT_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          CONDUIT_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Check the signature
        working-directory: mobile/android
        run: |
          set -o pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          ls -l "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          echo "apksigner from $tools"
          if ! certs=$("${tools}apksigner" verify --print-certs "$apk" 2>&1); then
            echo "$certs"
            echo "::error::apksigner could not verify the APK."
            exit 1
          fi
          echo "$certs"
          # The certificate's SHA-256 (apksigner names the signer "#1" or by SDK range).
          digest=$(echo "$certs" | sed -n 's/^Signer.*certificate SHA-256 digest: *//p' | head -n 1)
          if [ -z "$digest" ]; then
            echo "::error::No signing certificate found in apksigner's output."
            exit 1
          fi
          # Never publish a build signed with the public debug key (by name or by its digest).
          debug=fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
          if [ "$digest" = "$debug" ] || echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
          echo "Signed with $digest"

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.meta.outputs.base }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: |
          name="conduit-mobile-$BASE-b$BUILD.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          gh release create "mobile-b$BUILD" "$RUNNER_TEMP/$name" \
            --target "$GITHUB_SHA" \
            --title "Phone app $BASE (build $BUILD)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/conduit-release.jks"
