name: Release

# One Conduit release carries everything, all built from the same tag:
#   desktop  Conduit_<v>_universal.dmg (macOS), Conduit_<v>_x64_en-US.msi (Windows), and the
#            updater payloads + latest.json the installed desktop app updates from
#   android  conduit-mobile-<v>-b<build>.apk, signed with Conduit's release key; the phone app
#            offers it as an update (Settings -> App) by reading these releases
#   ios      conduit-mobile-<v>-unsigned.ipa: an unsigned build of the same app, for sideloading
#            (AltStore, Sideloadly) until App Store / TestFlight signing is set up
#
# A `vX.Y.Z` tag publishes. `vX.Y.Z-rc1` publishes a prerelease, which neither the desktop nor
# the phone updater ever offers. Running the workflow by hand builds the two phone apps from the
# chosen branch and publishes nothing -- the way to check a phone change before a release.
#
# <build> (the Android versionCode and the iOS build number) is derived from the version, so it
# only ever goes up: ((major*1000 + minor)*1000 + patch)*10, plus 9 for a full release or the
# prerelease's number (capped at 8). 0.51.0 -> 510009, 0.51.0-rc2 -> 510002.
#
# Phone signing secrets (the job fails rather than publish an APK nobody can update to):
#   MOBILE_KEYSTORE_BASE64, MOBILE_KEYSTORE_PASSWORD, MOBILE_KEY_ALIAS, MOBILE_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then version=${REF_NAME#v}; else version=$(node -p "require('./package.json').version"); fi
          base=${version%%-*}
          if ! echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' is not X.Y.Z or X.Y.Z-<pre>."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$base"
          if [ "$version" = "$base" ]; then
            last=9
          else
            n=$(echo "${version#*-}" | grep -Eo '[0-9]+$' || echo 0)
            last=$(( n > 8 ? 8 : n ))
          fi
          build=$(( ((major * 1000 + minor) * 1000 + patch) * 10 + last ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Conduit $version, phone build $build"

  desktop:
    name: Desktop (${{ matrix.platform }})
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Both legs publish to the SAME tag and each rewrites latest.json for the
      # updater. Run them concurrently and the second overwrites the first's
      # manifest, silently dropping a platform from the update feed -- so they are
      # serialized rather than merely independent.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            # `bundle.targets` in tauri.conf.json is macOS-shaped, so the Windows
            # target is selected here rather than by changing shared config -- the
            # macOS output stays byte-for-byte what it was.
            args: --bundles msi
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@10.x). Do not also
      # set a `version:` here — action-setup errors on two sources.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Notarization uses an App Store Connect API key. The bundler auto-discovers
      # the private key at ~/private_keys/AuthKey_<APPLE_API_KEY>.p8, so we write it
      # there from a base64-encoded secret (keeps newlines intact, nothing on disk
      # in the repo).
      - name: Provision App Store Connect API key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      # The Windows MSI is UNSIGNED: SmartScreen shows "unrecognized app" on first
      # run until the download builds reputation. Authenticode now requires a
      # hardware-backed key (an HSM or a cloud signing service), so it cannot be a
      # secret in this repo. When one exists, wire it through
      # `bundle.windows.signCommand` -- no change to this workflow's shape.
      #
      # Updater signing (TAURI_SIGNING_PRIVATE_KEY) is separate and DOES apply to
      # both legs: it is what lets an installed Conduit trust an update payload.
      - name: Build, sign, notarize, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # App Store Connect API key notarization (replaces APPLE_ID/APPLE_PASSWORD).
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Conduit ${{ github.ref_name }}"
          releaseBody: |
            Everything for this version is below.

            - **macOS:** the `.dmg` (one app for Apple silicon and Intel)
            - **Windows:** the `.msi`
            - **Android:** `conduit-mobile-<version>-b<build>.apk`. The phone app also offers it itself (Settings -> App -> Update).
            - **iOS:** `conduit-mobile-<version>-unsigned.ipa`, unsigned: install it with AltStore or Sideloadly, which sign it with your own Apple ID.

            The installed desktop app updates itself from this release. What changed is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          releaseDraft: false
          # Hyphenated tags (v0.12.0-rc, -beta) publish as prereleases so they
          # never become the "latest" release the updater endpoint resolves to;
          # a clean vX.Y.Z is a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Require the signing secrets
        env:
          KS: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.MOBILE_KEY_ALIAS }}
          KP: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Phone release signing secrets are not set (MOBILE_KEYSTORE_BASE64, MOBILE_KEYSTORE_PASSWORD, MOBILE_KEY_ALIAS, MOBILE_KEY_PASSWORD). See mobile/README.md, 'Releases'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Prebuild
        env:
          CONDUIT_MOBILE_BUILD: ${{ needs.meta.outputs.build }}
          CONDUIT_RELEASE_VERSION: ${{ needs.meta.outputs.base }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Write the keystore
        env:
          KS: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/conduit-release.jks"

      - name: Gradle assembleRelease
        working-directory: mobile/android
        env:
          CONDUIT_MOBILE_BUILD: ${{ needs.meta.outputs.build }}
          CONDUIT_RELEASE_VERSION: ${{ needs.meta.outputs.base }}
          CONDUIT_KEYSTORE: ${{ runner.temp }}/conduit-release.jks
          CONDUIT_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          CONDUIT_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          CONDUIT_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/conduit-release.jks"

      - name: Check the signature
        working-directory: mobile/android
        run: |
          set -o pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          ls -l "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          echo "apksigner from $tools"
          if ! certs=$("${tools}apksigner" verify --print-certs "$apk" 2>&1); then
            echo "$certs"
            echo "::error::apksigner could not verify the APK."
            exit 1
          fi
          echo "$certs"
          # The certificate's SHA-256. apksigner's wording moves between build-tools: "Signer #1 certificate",
          # "Signer (minSdkVersion=..) certificate", "V2 Signer: certificate" (37.0.0).
          digest=$(echo "$certs" | sed -n 's/^.*[Ss]igner.*certificate SHA-256 digest: *//p' | head -n 1)
          if [ -z "$digest" ]; then
            echo "::error::No signing certificate found in apksigner's output."
            exit 1
          fi
          # Never publish a build signed with the public debug key (by name or by its digest):
          # in-app updates install whatever APK the release carries.
          debug=fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
          if [ "$digest" = "$debug" ] || echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
          echo "Signed with $digest"

      - name: Name the APK
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/conduit-mobile-$VERSION-b$BUILD.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS app (unsigned)
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # Prebuild also runs `pod install`.
      - name: Prebuild
        env:
          CONDUIT_MOBILE_BUILD: ${{ needs.meta.outputs.build }}
          CONDUIT_RELEASE_VERSION: ${{ needs.meta.outputs.base }}
        run: npx expo prebuild --platform ios --clean

      # Unsigned on purpose: there is no iOS distribution certificate in this repo's secrets yet.
      # A sideloading tool re-signs the app with the installer's own Apple ID.
      - name: Build
        env:
          CONDUIT_MOBILE_BUILD: ${{ needs.meta.outputs.build }}
          CONDUIT_RELEASE_VERSION: ${{ needs.meta.outputs.base }}
        run: |
          set -o pipefail
          xcodebuild -version
          ws=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$ws" .xcworkspace)
          echo "Building $scheme from $ws"
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Package the IPA
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          app=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          test -n "$app" || { echo "::error::No .app was built."; exit 1; }
          # A release bundle must carry its JavaScript: without it the app opens on a red screen.
          test -f "$app/main.jsbundle" || { echo "::error::$app has no main.jsbundle."; exit 1; }
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$app" "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out"
          zip -qry "conduit-mobile-$VERSION-unsigned.ipa" Payload
          ls -l ./*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach the phone apps
    needs: [meta, desktop, android, ios]
    # The release exists once the desktop legs have published it. Attach whichever phone build
    # succeeded, then fail if one did not, so a missing app shows red rather than being silently absent.
    if: always() && github.event_name == 'push' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          shopt -s nullglob
          files=(out/*.apk out/*.ipa)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi
          echo "Android: $ANDROID, iOS: $IOS"
          if [ "$ANDROID" != success ] || [ "$IOS" != success ]; then
            echo "::error::A phone app did not build (Android: $ANDROID, iOS: $IOS); the release is missing it."
            exit 1
          fi
