# pnpm 10+ reads settings from this file, not package.json's "pnpm" field (which it ignores).
# This sidecar is its own workspace root, with its own lockfile.
#
# Security overrides force patched versions of transitive deps flagged by Dependabot, each
# scoped to its vulnerable range. Most come from @vector-im/matrix-bot-sdk's express server
# and its (deprecated) request client; tough-cookie 4 keeps the sync CookieJar API request uses.
overrides:
  "body-parser@<1.20.9": "^1.20.9"
  "form-data@<2.5.6": "^2.5.6"
  "morgan@<1.12.1": "^1.12.1"
  "nanoid@<3.3.18": "^3.3.18"
  "postcss@<8.5.23": "^8.5.23"
  "proxy-addr@<2.0.8": "^2.0.8"
  "qs@<6.16.1": "^6.16.1"
  "sanitize-html@<2.18.0": "^2.18.0"
  "source-map-js@<1.2.2": "^1.2.2"
  "tinypool@<2.1.2": "^2.1.2"
  "tough-cookie@<4.1.3": "^4.1.3"

onlyBuiltDependencies:
  - "@matrix-org/matrix-sdk-crypto-nodejs"
  - esbuild

